[project]
name = "cartpole-policy-gradient"
version = "0.1.0"
description = "A PyTorch REINFORCE agent that learns Gymnasium CartPole-v1"
readme = "README.md"
requires-python = ">=3.10,<3.14"  # pygame wheels are not available for 3.14
dependencies = [
    "gymnasium>=1.0",
    "numpy>=1.24",
    "torch>=2.2",
    "pygame>=2.5",          # live rendering for `play`
    "imageio>=2.31",        # GIF encoding for `gif`
    "pillow>=10",           # imageio's GIF backend
]

[tool.uv]
package = false  # single-script project; run it with `uv run python cartpole_pg.py`
